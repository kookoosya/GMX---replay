<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GMXReply Arcade</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top,#1a2442 0%,#0c1220 36%,#060913 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .shell { max-width: 1480px; margin: 0 auto; padding: 24px; display: grid; gap: 18px; }
    .panel {
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      background: rgba(9,13,24,.86);
      box-shadow: 0 28px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
      padding: 20px;
    }
    .heroRow, .libraryHead, .playerHead { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
    .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; opacity: .72; }
    .eyebrow.warn { color: #fde68a; }
    h1, h2 { margin: 0; }
    h1 { font-size: 34px; font-weight: 900; }
    h2 { font-size: 26px; font-weight: 900; }
    .heroText, .sub, .muted, .playerNote { font-size: 14px; opacity: .76; max-width: 900px; line-height: 1.45; }
    .planCard { min-width: 220px; display: grid; gap: 8px; }
    .planMain, .planSub {
      padding: 11px 14px; border-radius: 14px; text-align: center;
      background: rgba(255,255,255,.06); font-weight: 800;
    }
    .planSub { background: rgba(255,255,255,.04); font-size: 13px; opacity: .82; }
    .filtersRow, .searchRow, .playerActions, .lockedActions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field {
      border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
      color: #fff; padding: 14px; outline: none; min-width: 220px;
    }
    .selectField { min-width: 180px; }
    .pill, .ghostBtn, .primaryBtn {
      border: 0; border-radius: 999px; padding: 11px 16px; cursor: pointer; color: #fff; font-weight: 800;
      background: rgba(255,255,255,.08);
    }
    .pillActive { background: rgba(59,130,246,.30); }
    .ghostBtn { border-radius: 12px; }
    .primaryBtn {
      border-radius: 12px;
      background: linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);
    }
    .primaryBtn.warm { color: #111827; background: linear-gradient(135deg,#f59e0b 0%,#fb7185 100%); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 18px; }
    .gridGotd { grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); max-width: 420px; }
    .tileGotd { border-color: rgba(251,191,36,.25); box-shadow: 0 0 0 1px rgba(251,191,36,.12), 0 22px 44px rgba(0,0,0,.20); }
    .tile {
      border: 1px solid rgba(255,255,255,.08); border-radius: 18px; overflow: hidden; background: rgba(2,6,23,.92); cursor: pointer;
      box-shadow: 0 22px 44px rgba(0,0,0,.20);
    }
    .tileMedia { position: relative; min-height: 210px; background: #020617; }
    .tileMedia img { width: 100%; height: 210px; object-fit: cover; object-position: center; display: block; filter: contrast(1.08) saturate(1.08); }
    .tileOverlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2,6,23,.04) 0%, rgba(2,6,23,.22) 55%, rgba(2,6,23,.72) 100%);
    }
    .tileTop, .tileBottom {
      position: absolute; left: 0; right: 0; padding: 16px; display: flex; justify-content: space-between; gap: 10px;
    }
    .tileTop { top: 0; align-items: flex-start; }
    .tileBottom { bottom: 0; flex-direction: column; background: linear-gradient(180deg, rgba(2,6,23,.00) 0%, rgba(2,6,23,.42) 36%, rgba(2,6,23,.74) 100%); }
    .tileIcon { font-size: 18px; line-height: 1; padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.18); }
    .tileBadges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .tileBadge {
      padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: .8px;
      background: rgba(59,130,246,.24);
    }
    .tileBadgePro { background: rgba(250,204,21,.24); }
    .tileBadgeLock { background: rgba(255,255,255,.18); }
    .tileTitle { font-size: 22px; font-weight: 900; line-height: 1.04; text-shadow: 0 8px 20px rgba(0,0,0,.86); }
    .tileMeta { font-size: 11px; opacity: .98; letter-spacing: .4px; text-shadow: 0 4px 12px rgba(0,0,0,.80); }
    .tileBody { padding: 16px; display: grid; gap: 10px; }
    .tileNote { min-height: 42px; font-size: 14px; opacity: .78; line-height: 1.42; }
    .tileFoot { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; opacity: .72; }
    .playerPanel { padding: 16px; }
    .playerWrap { margin-top: 14px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); background: #020617; min-height: 72vh; }
    .playerWrap iframe { width: 100%; min-height: 72vh; border: 0; display: block; background: #020617; }
    .loadMoreWrap { display: flex; justify-content: center; }
    .empty { padding: 16px; font-size: 14px; opacity: .76; }
    #arcadeStatus { font-size: 12px; opacity: .58; text-align: center; padding-bottom: 20px; }
    @media (max-width: 900px) {
      .searchRow { display: grid; grid-template-columns: 1fr; }
      .field, .selectField { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="arcadeRoot"></div>
    <div id="arcadeStatus"></div>
  </div>
  <script defer src="/i18n/siteI18n.js"></script>
  <script defer src="/arcade.js?v=SAFE15"></script>
</body>
</html>
