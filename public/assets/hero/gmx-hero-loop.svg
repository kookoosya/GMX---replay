  <text x="72" y="250" fill="#f2f6ff" font-family="Segoe UI, system-ui, sans-serif" font-size="56" font-weight="800">Reply on X</text>
  <text x="72" y="318" fill="#9fb0d9" font-family="Segoe UI, system-ui, sans-serif" font-size="30">Play browser games</text>
  <text x="72" y="372" fill="#7f93bf" font-family="Segoe UI, system-ui, sans-serif" font-size="20">Copy-first GM/GN — jump into Arcade when you are ready</text>
  <rect x="72" y="410" width="240" height="54" rx="14" fill="url(#accent)"/>
  <text x="192" y="444" text-anchor="middle" fill="#081018" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">GMXReply</text>
