services:
  - type: web
    name: gmxreply
    runtime: node
    branch: main
    buildCommand: npm install && npm --prefix frontend install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_ADMIN_SESSION
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
