services:
  - type: web
    name: gmxreply
    runtime: node
    branch: main
    buildCommand: npm ci && npm ci --prefix frontend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_ADMIN_SESSION
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://www.gmxreply.com,https://gmxreply.com
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DB_MODE
        value: sqlite
      - key: SOLANA_RPC
        sync: false
      - key: SOL_RECEIVER
        sync: false
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
