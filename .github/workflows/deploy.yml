name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci && npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Full check-in
        env:
          E2E_BASE: http://127.0.0.1:10000
        run: |
          node index.js &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:10000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:full
          kill "$SERVER_PID"
